- id: vibeaudit
  name: vibeaudit
  description: Block commits that add secrets, missing auth, injection or unsafe AI code (staged lines only).
  entry: vibeaudit scan . --staged --offline --external none -q
  language: python
  pass_filenames: false
  always_run: true
- id: vibeaudit-secrets
  name: vibeaudit (secrets, fast)
  description: Block commits that add secrets, checking only the staged lines (well under a second).
  entry: vibeaudit-hook
  language: python
  pass_filenames: false
  always_run: true
