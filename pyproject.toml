[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeaudit"
dynamic = ["version"]
description = "Security and quality audit for AI-generated (vibe-coded) and LLM-powered apps: secrets, hallucinated packages, missing auth, injection, prompt injection, unsafe model output, cost limits and more."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ashin" }]
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
keywords = ["security", "sast", "llm", "ai", "vibe-coding", "prompt-injection", "slopsquatting", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vibeaudit = "vibeaudit.cli:main"

[project.urls]
Homepage = "https://github.com/Ashin-06/vibeaudit"

[tool.setuptools.dynamic]
version = { attr = "vibeaudit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibeaudit = ["data/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["network: needs internet access (registry and OSV lookups)"]
