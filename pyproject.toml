[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeaudit"
dynamic = ["version"]
description = "Security and quality audit for AI-generated (vibe-coded) and LLM-powered apps: secrets, hallucinated packages, missing auth, injection, prompt injection, unsafe model output, cost limits and more."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ashin" }]
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
keywords = ["security", "sast", "static-analysis", "llm", "ai", "vibe-coding", "prompt-injection", "slopsquatting",
            "supply-chain", "secrets", "accessibility", "sarif", "mcp", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]  # pyyaml: tools/check_yaml.py only, never imported by vibeaudit

[project.scripts]
vibeaudit = "vibeaudit.cli:main"
vibeaudit-hook = "vibeaudit.hook:main"

[project.urls]
Homepage = "https://github.com/Ashin-06/vibeaudit"
Documentation = "https://github.com/Ashin-06/vibeaudit#readme"
Source = "https://github.com/Ashin-06/vibeaudit"
Issues = "https://github.com/Ashin-06/vibeaudit/issues"
Changelog = "https://github.com/Ashin-06/vibeaudit/blob/main/CHANGELOG.md"
Security = "https://github.com/Ashin-06/vibeaudit/blob/main/SECURITY.md"

[tool.setuptools.dynamic]
version = { attr = "vibeaudit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibeaudit = ["data/*.gz", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
norecursedirs = ["fixtures"]
markers = ["network: needs internet access (registry and OSV lookups)"]
# live network tests are opt-in (`python -m pytest -m network`), so an outage elsewhere cannot fail a build
addopts = "-m 'not network'"
