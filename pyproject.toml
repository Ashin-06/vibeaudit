[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeaudit"
dynamic = ["version"]
description = "Security and quality audit for AI-generated (vibe-coded) and LLM-powered apps: secrets, hallucinated packages, missing auth, injection, prompt injection, unsafe model output, cost limits and more."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ashin" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["security", "sast", "static-analysis", "llm", "ai", "vibe-coding", "prompt-injection", "slopsquatting",
            "supply-chain", "secrets", "accessibility", "sarif", "mcp", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6", "ruff>=0.9", "mypy>=1.14", "jsonschema>=4.20"]
# optional real parser for Go, Rust, Java, JavaScript and TypeScript function indexing; without it the regex index is used
parse = [
    "tree-sitter>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
vibeaudit = "vibeaudit.cli:main"
vibeaudit-hook = "vibeaudit.hook:main"

[project.urls]
Homepage = "https://github.com/Ashin-06/vibeaudit"
Documentation = "https://github.com/Ashin-06/vibeaudit#readme"
Source = "https://github.com/Ashin-06/vibeaudit"
Issues = "https://github.com/Ashin-06/vibeaudit/issues"
Changelog = "https://github.com/Ashin-06/vibeaudit/blob/main/CHANGELOG.md"
Security = "https://github.com/Ashin-06/vibeaudit/blob/main/SECURITY.md"

[tool.setuptools.dynamic]
version = { attr = "vibeaudit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibeaudit = ["py.typed", "data/*.gz", "data/*.txt", "data/*.json", "studio_assets/*"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S310", "S311", "S314", "S318", "S603", "S607", "S608"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
norecursedirs = ["fixtures"]
markers = [
    "network: needs internet access (registry and OSV lookups)",
    "slow: slow fuzzing, stress, ReDoS or performance tests",
]
# live network tests are opt-in (`python -m pytest -m network`), so an outage elsewhere cannot fail a build
addopts = "-m 'not network'"
