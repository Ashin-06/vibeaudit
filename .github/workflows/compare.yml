name: Compare with Semgrep and Bandit

# Head-to-head on the pinned benchmark corpus (tools/compare.py). Manual and weekly; never on pull requests,
# because it clones 53 repositories and runs three scanners. Results are uploaded as an artifact; a maintainer
# labels the precision sample and commits benchmark/compare.json.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install vibeaudit, Semgrep and Bandit (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "semgrep==1.100.0" "bandit==1.8.0"
      - name: Fetch the pinned corpus
        run: python tools/benchmark.py fetch
      - name: Compare
        run: python tools/compare.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: compare-results
          path: |
            benchmark/compare.json
            benchmark/compare_sample.json
