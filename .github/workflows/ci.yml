name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12", "3.13"]
        exclude:
          # setup-python ships no 3.9 build for the current Ubuntu image (3.9 is end-of-life);
          # 3.9 is still tested on Windows and macOS.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit, fixture and network tests
        run: python -m pytest -q
      - name: Plain ASCII check
        run: python tools/check_ascii.py
      - name: Scan this repository with itself
        run: vibeaudit scan . --external none --fail-on high --no-color -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/vibeaudit --version
          /tmp/clean/bin/vibeaudit rules | wc -l
          cd /tmp && /tmp/clean/bin/vibeaudit scan "$GITHUB_WORKSPACE/src" --offline --external none -q --fail-on none --report sarif:/tmp/out.sarif
          python -c "import json; json.load(open('/tmp/out.sarif'))"

  bandit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run vibeaudit with bandit installed
        run: |
          python -m pip install -e ".[dev]" bandit
          python -m pytest -q tests/test_deps_llm_external.py -k external
          vibeaudit scan src --offline --external bandit --fail-on none -q --report json:/tmp/out.json
          python -c "import json; d = json.load(open('/tmp/out.json')); assert d['meta']['external_tools'] == ['bandit'], d['meta']"
