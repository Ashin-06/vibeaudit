name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy typecheck
        run: mypy src/vibeaudit

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and fixture tests (fast suite)
        run: python -m pytest -q -m "not slow and not network"
      - name: Live network tests (registry and OSV; informational, cannot fail the build)
        continue-on-error: true
        run: python -m pytest -q -m network
      - name: Plain ASCII check
        run: python tools/check_ascii.py
      - name: Scan this repository with itself
        run: vibeaudit scan . --external none --fail-on high --no-color -q

  parse:
    # the optional tree-sitter index (vibeaudit[parse]); the test job above covers the regex fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install with the parse extra
        run: python -m pip install -e ".[dev,parse]"
      - name: Parser is active for Go, Rust, Java, JS and TS
        run: python -c "from vibeaudit.parse import mode; m = mode(); assert set(m.values()) == {'tree-sitter'}, m"
      - name: Unit and fixture tests (fast suite)
        run: python -m pytest -q -m "not slow and not network"
      - name: Scan this repository with itself
        run: vibeaudit scan . --external none --fail-on high --no-color -q

  code-scanning:
    # vibeaudit's own SARIF, shown in the repository's Security tab
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: vibeaudit scan . --external none --include-preview -r sarif:vibeaudit.sarif
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: vibeaudit.sarif

  no-install:
    # the suite must also pass from a plain checkout, without `pip install -e`
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests without installing vibeaudit
        shell: bash
        run: |
          python -m pip install pytest
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('vibeaudit') is not None)"
          python -m pytest -q -m "not slow and not network"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # a YAML error in action.yml breaks every workflow that uses the action, and nothing else would notice
      - name: action.yml, the hook definitions and the workflows are valid YAML
        run: |
          python -m pip install --quiet pyyaml==6.0.2
          python tools/check_yaml.py
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -c "import glob, zipfile; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert any(n.endswith('vibeaudit/py.typed') for n in z.namelist()), z.namelist()"
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/vibeaudit --version
          /tmp/clean/bin/vibeaudit rules | wc -l
          cd /tmp && /tmp/clean/bin/vibeaudit scan "$GITHUB_WORKSPACE/src" --offline --external none -q --fail-on none --report sarif:/tmp/out.sarif
          python -c "import json; json.load(open('/tmp/out.sarif'))"
      - name: Build container image and run non-root read-only smoke test
        run: |
          docker build -t vibeaudit:ci .
          docker run --rm --read-only --cap-drop ALL -v "$GITHUB_WORKSPACE/tests/fixtures/vuln_flask_llm:/workspace:ro" vibeaudit:ci --version
          docker run --rm --read-only --cap-drop ALL -v "$GITHUB_WORKSPACE/tests/fixtures/clean_app:/workspace:ro" vibeaudit:ci scan /workspace --offline --external none --no-cache -q --fail-on high

  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Deep fuzzing and the 10,000-file scale test
        env:
          VIBEAUDIT_FUZZ_ROUNDS: "60"
          VIBEAUDIT_PERF_FILES: "10000"
          VIBEAUDIT_HOOK_BUDGET_MS: "150"  # the pre-commit fast path on a typical commit
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q -s tests/test_fuzz.py tests/test_performance.py tests/test_redos.py tests/test_hook.py

  action-and-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The action passes on the clean sample app
        uses: ./
        with:
          path: tests/fixtures/clean_app
          args: --offline --external none --exclude legacy/*
          sarif: clean.sarif
      - name: The action fails on a vulnerable sample app
        id: vulnerable
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/vuln_flask_llm
          args: --offline --external none
          fail-on: critical
          setup-python: "false"
      - name: Check both outcomes and the SARIF files
        env:
          VULN_OUTCOME: ${{ steps.vulnerable.outcome }}
        run: |
          test "$VULN_OUTCOME" = "failure"
          python -c "import json; d = json.load(open('clean.sarif')); assert d['runs'][0]['results'] == [], d"
          python -c "import json; d = json.load(open('vibeaudit.sarif')); assert d['runs'][0]['results']"
      - name: The pre-commit hook definition works
        run: |
          python -m pip install --quiet pre-commit
          pre-commit try-repo . vibeaudit --all-files
          pre-commit try-repo . vibeaudit-secrets --all-files

  bandit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Run vibeaudit with bandit installed
        run: |
          python -m pip install -e ".[dev]" bandit
          python -m pytest -q tests/test_deps_llm_external.py -k external
          vibeaudit scan src --offline --external bandit --fail-on none -q --report json:/tmp/out.json
          python -c "import json; d = json.load(open('/tmp/out.json')); assert d['meta']['external_tools'] == ['bandit'], d['meta']"

  benchmark:
    # accuracy gate (benchmark/README.md): fails when a rule's precision on the labelled corpus drops below
    # benchmark/baseline.json, a labelled true positive is no longer reported, or seeded recall drops.
    # A repository that cannot be fetched is retried, then skipped and listed; it never fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore the corpus checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/vibeaudit-bench
          key: vibeaudit-bench-${{ hashFiles('benchmark/corpus.json') }}
      - name: Fetch the pinned corpus
        run: python tools/benchmark.py fetch
      - name: Benchmark gate
        run: python tools/benchmark.py check --json benchmark-results.json
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: ignore

  vscode-extension:
    # the VS Code / Cursor client for `vibeaudit lsp`: built and bundled as a .vsix artifact on every push (release.yml publishes it)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install the pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the extension script
        run: node --check extension.js
      - name: Build the .vsix
        run: npx --no-install vsce package --out vibeaudit.vsix
      - name: Keep the .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vibeaudit-vscode-extension
          path: editors/vscode/vibeaudit.vsix
          if-no-files-found: error
