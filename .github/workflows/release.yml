name: Release

# On a version tag: build the sdist and wheel, write a CycloneDX SBOM, sign build provenance for all three
# (GitHub artifact attestations, Sigstore-backed) and attach them to the GitHub release. When the repository
# variable PYPI_PUBLISH is "true", it then starts publish.yml for the tag, which uploads the same files to PyPI.
# How to verify a download: README.md, "Verifying a release".

on:
  push:
    tags: ["v*"]
  # a manual run builds, writes the SBOM and signs, but creates no release: a rehearsal of the signing step
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload its files
      id-token: write       # Sigstore signing identity for the attestation
      attestations: write   # store the attestation
      actions: write        # start publish.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag against the package version and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/vibeaudit/__init__.py').read()).group(1))")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$TAG" = "v$VERSION" || { echo "tag $TAG does not match version $VERSION"; exit 1; }
          fi
          python tools/release_notes.py "$VERSION" > notes.md
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.4.4 cyclonedx-bom==7.6.0
          python -m build
      - name: Install the wheel in a clean environment and write its SBOM
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/vibeaudit --version
          /tmp/clean/bin/python -m pip uninstall -y pip
          cyclonedx-py environment /tmp/clean/bin/python --output-format JSON \
            --output-file "dist/vibeaudit-$VERSION.cdx.json"
      - name: Sign build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
      - name: Create the GitHub release with the files
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "vibeaudit $VERSION" --notes-file notes.md --verify-tag
          fi
      # A release made with GITHUB_TOKEN does not trigger publish.yml's `release` event, but a workflow_dispatch does.
      # publish.yml stays a workflow of its own (not a workflow_call): PyPI trusted publishing is registered for it
      # by name, and a called workflow's token names the caller.
      - name: Start the PyPI upload
        if: github.event_name == 'push' && vars.PYPI_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f tag="$TAG"

      # pages.yml's `release` event is not triggered for the same reason, so the sample report is rebuilt here
      - name: Rebuild the sample report
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  vscode-extension:
    # Publishes editors/vscode to the VS Code Marketplace and to Open VSX (used by Cursor and VSCodium).
    # Off until the repository variable VSCODE_PUBLISH is "true"; each store also needs its token as a secret
    # of the "vscode-marketplace" environment (VSCE_PAT, OVSX_PAT). A store without a token is skipped.
    needs: release
    if: github.event_name == 'push' && vars.VSCODE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Check the extension version against the tag
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm ci --no-audit --no-fund
      - name: Build the bundled .vsix
        run: npx --no-install vsce package --out vibeaudit.vsix
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::notice::VSCE_PAT not set; skipped"; exit 0; fi
          npx --no-install vsce publish --packagePath vibeaudit.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::notice::OVSX_PAT not set; skipped"; exit 0; fi
          npx --yes ovsx@0.10.6 publish vibeaudit.vsix --pat "$OVSX_PAT"
