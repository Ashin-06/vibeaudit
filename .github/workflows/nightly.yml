name: Nightly Slow & Fuzz Suite

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run slow, fuzz, ReDoS, and performance tests
        env:
          VIBEAUDIT_FUZZ_ROUNDS: "150"
          VIBEAUDIT_PERF_FILES: "10000"
        run: python -m pytest -q -m slow
