name: Real-world regression suite

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realworld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Restore real-world checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/vibeaudit-bench
          key: vibeaudit-realworld-${{ hashFiles('benchmark/realworld_manifest.json') }}
      - name: Fetch and check real-world regression manifest
        run: python tools/realworld_regression.py --fetch --check --json realworld-results.json
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: realworld-results
          path: realworld-results.json
          if-no-files-found: ignore
