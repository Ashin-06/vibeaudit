# Only the real manifests. The sample apps under tests/fixtures and benchmark/seeded are vulnerable or
# unpinned on purpose and are never installed, so they get no update pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  # the VS Code / Cursor extension: its build tool (@vscode/vsce) pins glob and minimatch through `overrides`
  # in its package.json until a vsce release asks for the patched versions itself
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
